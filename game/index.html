<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kotodama">
<meta name="theme-color" content="#140a1c">
<title>言霊 Kotodama Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face { font-family: "Press Start 2P"; src: url("../fonts/pressstart.woff2") format("woff2"); font-display: swap; }
:root {
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --ink: #fff; --win: rgba(22, 16, 42, .95); --edge: #f4e7c3; --gold: #f2c14e; --dim: #b9b0d8;
  --jp: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", YuGothic, Meiryo, "Noto Sans JP", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #140a1c; overflow: hidden; overscroll-behavior: none; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#game { position: fixed; inset: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
.jp { font-family: var(--jp); }
.dim { color: var(--dim); }
.center { text-align: center; }
ruby rt { font-size: .5em; opacity: .9; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; }

/* botões e janelas */
.btn { background: linear-gradient(#5b46b8, #4432a0); border: 2px solid #1a1030; border-bottom-width: 4px; color: #fff; padding: 10px 14px; border-radius: 10px; font-weight: 700; }
.btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn.sec { background: linear-gradient(#4a4460, #38324c); }
.btn.tiny { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.danger { background: linear-gradient(#c8404a, #9a2a34); }
.btn.on { background: linear-gradient(#3aa860, #2a8048); }
.el { display: inline-flex; align-items: center; justify-content: center; width: 1.55em; height: 1.55em; border-radius: 50%; border: 2px solid; font-family: var(--jp); font-weight: 900; font-size: .8em; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.5); vertical-align: middle; }

/* HUD */
#hud { position: absolute; top: calc(8px + var(--sat)); left: 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 5; }
body:not([data-scene="world"]) #hud, body:not([data-scene="world"]) #menubtn, body:not([data-scene="world"]) #touch { display: none; }
.hud-money, .hud-lead { background: var(--win); border: 2px solid var(--edge); border-radius: 10px; padding: 4px 10px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.hud-lead img { width: 34px; height: 34px; }
.mini-hp { display: block; width: 90px; height: 6px; background: #2a2440; border-radius: 3px; overflow: hidden; margin-top: 3px; }
.mini-hp span { display: block; height: 100%; }
#menubtn { position: absolute; top: calc(8px + var(--sat)); right: 8px; z-index: 5; width: 46px; height: 46px; border-radius: 12px; background: var(--win); border: 2px solid var(--edge); font-size: 22px; }

/* controles de toque */
#touch { display: none; }
body.touch #touch { display: block; }
#dpad { position: absolute; left: 18px; bottom: calc(22px + var(--sab)); width: 150px; height: 150px; border-radius: 50%; background: rgba(20, 14, 36, .45); border: 2px solid rgba(244, 231, 195, .5); z-index: 6; touch-action: none; }
#dpad::before { content: ""; position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px; border-radius: 50%; background: rgba(244, 231, 195, .18); }
#dpad i { position: absolute; color: rgba(255,255,255,.7); font-style: normal; font-size: 18px; }
#dpad .u { top: 8px; left: 50%; transform: translateX(-50%); } #dpad .d { bottom: 8px; left: 50%; transform: translateX(-50%); }
#dpad .l { left: 10px; top: 50%; transform: translateY(-50%); } #dpad .r { right: 10px; top: 50%; transform: translateY(-50%); }
#dpad.act-up .u, #dpad.act-down .d, #dpad.act-left .l, #dpad.act-right .r { color: var(--gold); }
#abtn { position: absolute; right: 24px; bottom: calc(46px + var(--sab)); width: 78px; height: 78px; border-radius: 50%; background: linear-gradient(#e24a52, #b0283a); border: 3px solid #fff; font: 900 26px "Press Start 2P", system-ui; z-index: 6; box-shadow: 0 5px 0 rgba(0,0,0,.35); touch-action: none; }
#abtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }

/* diálogo (balão de papel) */
#dialog { position: absolute; left: 0; right: 0; bottom: calc(10px + var(--sab)); display: none; justify-content: center; padding: 0 10px; z-index: 20; }
#dialog.show { display: flex; }
.dlg { position: relative; width: min(760px, 100%); background: #fffaf0; color: #2a1a10; border: 3px solid #3a2a1a; border-radius: 16px; padding: 18px 18px 10px; box-shadow: 0 6px 0 rgba(0,0,0,.35); cursor: pointer; animation: pop .15s ease-out; }
@keyframes pop { from { transform: scale(.94); } }
.dlg-name { position: absolute; top: -16px; left: 16px; background: #3a2a1a; color: #fff; padding: 3px 12px; border-radius: 10px; font-weight: 700; font-size: 14px; }
.dlg-jp { font-size: 22px; line-height: 1.7; font-weight: 700; }
.dlg-ro { color: #7a5a3a; font-size: 14px; margin-top: 2px; font-style: italic; }
.dlg-pt { color: #3a6a4a; font-size: 14px; margin-top: 6px; border-top: 1px dashed #d8c8a8; padding-top: 6px; }
.dlg-bar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.dlg-bar button { background: #efe2c4; border: 2px solid #c8b088; color: #3a2a1a; border-radius: 8px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
.dlg-next { margin-left: auto; color: #3a2a1a; animation: bob 1s infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

/* painéis */
#panel { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8, 4, 16, .55); z-index: 30; padding: calc(10px + var(--sat)) 10px calc(10px + var(--sab)); }
#panel.show { display: flex; }
.pwin { width: min(520px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--win); border: 3px solid var(--edge); border-radius: 16px; box-shadow: inset 0 0 0 2px #2b2b50, 0 8px 0 rgba(0,0,0,.4); animation: pop .15s ease-out; }
.pwin.wide { width: min(760px, 100%); }
.phead { display: flex; align-items: center; padding: 12px 14px; border-bottom: 2px solid rgba(244,231,195,.25); }
.ptitle { font-weight: 800; font-size: 17px; }
.pclose { margin-left: auto; background: none; border: 0; font-size: 20px; color: var(--edge); }
.pbody { padding: 12px 14px 16px; overflow: auto; -webkit-overflow-scrolling: touch; }
.pbody p { margin: 6px 0; }
.pbody h4 { margin: 14px 0 6px; color: var(--gold); }
.mgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 480px) { .mgrid { grid-template-columns: repeat(2, 1fr); } }
.mbtn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; background: #2c2450; border: 2px solid #4a3e7a; border-radius: 12px; font-size: 26px; }
.mbtn span { font-size: 13px; font-weight: 700; }
.mfoot { margin-top: 12px; font-size: 13px; color: var(--dim); text-align: center; }
.plist { display: flex; flex-direction: column; gap: 6px; }
.prow { display: flex; align-items: center; gap: 10px; text-align: left; background: #2c2450; border: 2px solid #4a3e7a; border-radius: 12px; padding: 6px 10px; position: relative; }
.pico { width: 48px; height: 48px; }
.pinfo { display: flex; flex-direction: column; gap: 2px; }
.lead { position: absolute; right: 10px; top: 8px; color: var(--gold); }
.sdet { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.sbig { width: 110px; height: 110px; }
.gray { filter: grayscale(1) brightness(.6); }
.kinfo { margin-top: 4px; font-size: 14px; }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mv { background: #2c2450; border-radius: 10px; padding: 6px 10px; display: flex; flex-direction: column; }
.mv .jp { font-size: 20px; font-weight: 800; }
.mv.locked { opacity: .45; }
.hwbox { display: flex; justify-content: center; margin: 10px 0; }
.hwbox > div { background: #fffaf0; border-radius: 12px; border: 3px solid #3a2a1a; }
.brow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.brow.col { flex-direction: column; }
.dexsum { text-align: center; margin-bottom: 8px; }
.dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.dexc { background: #2c2450; border: 2px solid #4a3e7a; border-radius: 10px; display: flex; flex-direction: column; align-items: center; padding: 4px; min-height: 64px; justify-content: center; }
.dexc img { width: 40px; height: 40px; }
.dexc.unk { color: #5a5078; font-size: 22px; }
.dexc.seen img { filter: grayscale(1) brightness(.7); }
.recipe { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #2c2450; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
.recipe.can { border: 2px solid var(--gold); }
.rbig { font-size: 22px; font-weight: 800; }
.ilist { display: flex; flex-direction: column; gap: 6px; }
.irow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #2c2450; border-radius: 10px; padding: 8px 12px; }
.irow .jp { font-size: 18px; }
.irow small { flex: 1 1 100%; }
.price { color: var(--gold); font-weight: 800; }
.blist { display: flex; flex-direction: column; gap: 6px; }
.brow2 { display: flex; align-items: center; gap: 10px; text-align: left; background: #2c2450; border: 2px solid #4a3e7a; border-radius: 12px; padding: 8px 10px; }
.brow2.on { border-color: #5ad16a; }
.bic { width: 38px; height: 38px; border-radius: 50%; background: var(--gold); color: #2a1a10; display: flex; align-items: center; justify-content: center; font-weight: 900; font-family: var(--jp); flex: none; }
.btog { margin-left: auto; font-weight: 800; }
.brow2.on .btog { color: #5ad16a; }
.opt { background: #2c2450; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.opt small { flex: 1 1 100%; }
.seg { display: flex; gap: 6px; }
.seg button { background: #3a3060; border: 2px solid #5a4e8a; border-radius: 8px; padding: 6px 10px; font-weight: 700; }
.seg button.on { background: #5b46b8; border-color: var(--gold); }
.help p { line-height: 1.5; }
.fuse-line { display: flex; align-items: center; justify-content: center; gap: 6px; }
.fuse-line img { width: 72px; height: 72px; }
.fuse-line .plus { font-size: 26px; font-weight: 900; color: var(--gold); }
.fuse-line .q { font-size: 44px; font-weight: 900; }
.fuse-res { display: flex; justify-content: center; animation: pop .4s ease-out; }
.fuse-res img { width: 150px; height: 150px; }
.starters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 480px) { .starters { grid-template-columns: 1fr; } .starter { flex-direction: row !important; flex-wrap: wrap; text-align: left !important; } }
.starter { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; background: #2c2450; border: 3px solid; border-radius: 14px; padding: 10px; }
.starter img { width: 84px; height: 84px; }
.starter .big { font-size: 34px; font-weight: 900; }
.starter small { display: block; }

/* toast */
#toast { position: absolute; left: 50%; top: calc(70px + var(--sat)); transform: translateX(-50%) translateY(-20px); background: #fffaf0; color: #2a1a10; border: 3px solid #3a2a1a; border-radius: 12px; padding: 8px 14px; font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; max-width: 92vw; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* batalha */
#battle-ui { position: absolute; inset: 0; display: none; pointer-events: none; z-index: 10; }
#battle-ui.show { display: block; }
#battle-ui > * { pointer-events: auto; }
.plate { background: var(--win); border: 2px solid var(--edge); border-radius: 12px; padding: 6px 10px; font-size: 13px; width: min(46vw, 290px); }
.plate.enemy { position: absolute; top: calc(8px + var(--sat)); left: 8px; }
.pl-row { display: flex; align-items: center; gap: 6px; }
.pl-name { font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-name b { font-size: 17px; }
.pl-lv { font: 700 10px "Press Start 2P", system-ui; color: var(--gold); }
.hp { display: flex; align-items: center; gap: 6px; margin-top: 4px; font: 700 9px "Press Start 2P", system-ui; color: var(--gold); }
.hpbar { flex: 1; height: 9px; background: #2a2440; border-radius: 5px; overflow: hidden; border: 1px solid #000; }
.hpfill { height: 100%; transition: width .45s ease-out, background .45s; }
.pl-hpn { text-align: right; font: 700 10px "Press Start 2P", system-ui; margin-top: 3px; }
.xpbar { height: 4px; background: #2a2440; border-radius: 2px; margin-top: 4px; overflow: hidden; }
.xpfill { height: 100%; background: #6ab8ff; transition: width .45s; }
.crowd { position: absolute; top: calc(8px + var(--sat)); right: 8px; background: var(--win); border: 2px solid var(--edge); border-radius: 12px; padding: 6px 10px; text-align: center; }
.crowd.full { border-color: var(--gold); box-shadow: 0 0 16px var(--gold); animation: glow 1s infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 4px var(--gold); } }
.cr-l { font: 700 8px "Press Start 2P", system-ui; color: var(--dim); }
.cr-s { color: var(--gold); font-size: 17px; letter-spacing: 1px; }
.cr-s span { color: #4a4068; }
.bwrap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; padding: 0 8px calc(8px + var(--sab)); pointer-events: none; }
.bwrap > * { pointer-events: auto; }
.plate.me { align-self: flex-end; margin-bottom: 6px; }
@media (min-width: 900px) { .plate.me { margin-right: calc((100vw - 900px) / 2); } }
.bbox { width: min(900px, 100%); background: var(--win); border: 3px solid var(--edge); border-radius: 16px; padding: 10px 12px; box-shadow: inset 0 0 0 2px #2b2b50; min-height: 120px; max-height: 58vh; overflow: auto; }
.bmsg { font-size: 16px; line-height: 1.5; min-height: 1.5em; cursor: pointer; }
.bmsg b.jp { font-size: 1.15em; }
.bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.bbtn { background: #2c2450; border: 2px solid #4a3e7a; border-bottom-width: 4px; border-radius: 12px; padding: 12px 8px; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; text-align: center; }
.bbtn:disabled { opacity: .35; }
.bbtn:active { transform: translateY(2px); }
.bbtn.special { grid-column: 1 / -1; background: linear-gradient(90deg, #d8a020, #f2c14e, #d8a020); color: #2a1a10; border-color: #8a5a10; font-size: 17px; animation: glow 1s infinite alternate; }
.bbtn .mv { font-size: 22px; background: none; padding: 0; }
.mvp { font-size: 11px; color: var(--dim); flex-basis: 100%; }
.bico { width: 40px; height: 40px; }
.tapnext { display: block; margin: 10px auto 0; }
.reveal { margin-top: 8px; padding: 8px 12px; border-radius: 10px; font-size: 16px; line-height: 1.5; }
.reveal.ok { background: rgba(90, 209, 106, .15); border: 2px solid rgba(90, 209, 106, .5); }
.reveal.no { background: rgba(239, 90, 90, .15); border: 2px solid rgba(239, 90, 90, .55); }
.reveal b.jp { font-size: 1.3em; }
.reveal .close { color: var(--gold); font-size: 13px; }

/* pergunta */
.q { text-align: center; }
.qask { color: var(--dim); font-size: 14px; font-weight: 700; }
.qprompt { margin: 4px 0 6px; }
.qk { font-family: var(--jp); font-weight: 900; font-size: 64px; line-height: 1.1; }
.qj { font-family: var(--jp); font-weight: 800; font-size: 34px; line-height: 1.5; }
.qpt { font-size: 22px; font-weight: 800; }
.qsub { color: var(--dim); font-size: 14px; font-family: var(--jp); }
.qtimer { height: 10px; background: #2a2440; border-radius: 5px; overflow: hidden; margin: 6px auto 10px; max-width: 520px; border: 1px solid #000; }
.qbar { height: 100%; width: 100%; background: #5ad16a; }
.qopts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 640px; margin: 0 auto; }
.qo { position: relative; background: #2c2450; border: 2px solid #4a3e7a; border-bottom-width: 4px; border-radius: 12px; padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; justify-content: center; }
.qo:active { transform: translateY(2px); }
.qn { position: absolute; left: 7px; top: 4px; font: 700 8px "Press Start 2P", system-ui; color: #6a5e9a; }
body.touch .qn { display: none; }
.qv { font-size: 19px; font-weight: 700; }
.qro { font-size: 12px; color: var(--dim); }
.qo.right { background: #2a7a44; border-color: #5ad16a; }
.qo.wrong { background: #8a2a34; border-color: #ef5a5a; }
.qtype { display: flex; gap: 8px; max-width: 520px; margin: 0 auto; }
.qin { flex: 1; min-width: 0; font-size: 20px; padding: 10px 12px; border-radius: 10px; border: 3px solid #4a3e7a; background: #fffaf0; color: #2a1a10; user-select: text; -webkit-user-select: text; }
.qin.right { border-color: #5ad16a; } .qin.wrong { border-color: #ef5a5a; }
.qhint { color: var(--gold); font-size: 13px; min-height: 1em; margin-top: 4px; }
.qskip { background: none; border: 0; color: var(--dim); text-decoration: underline; font-size: 13px; margin-top: 4px; }

/* paciência */
#sol { position: absolute; inset: 0; z-index: 40; background: radial-gradient(circle at 50% 30%, #1f6a3a, #0e3a1e); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: calc(10px + var(--sat)) 8px calc(12px + var(--sab)); overflow: auto; }
.sol-top { width: min(760px, 100%); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; background: rgba(0,0,0,.3); border-radius: 12px; padding: 6px 12px; font-size: 13px; }
.sol-rule { font-size: 13px; color: #d8f0d8; text-align: center; max-width: 760px; }
.sol-board { position: relative; margin-top: 4px; }
.card { position: absolute; background: #fffaf0; color: #2a1a10; border: 2px solid #2a1a10; border-radius: 7px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 rgba(0,0,0,.35); overflow: hidden; }
.card.back { background: repeating-linear-gradient(45deg, #3a2a8a, #3a2a8a 6px, #4a3aa0 6px, #4a3aa0 12px); color: rgba(255,255,255,.5); font-family: var(--jp); font-weight: 900; }
.card.free { cursor: pointer; }
.card.free:hover { transform: translateY(-3px); }
.card.blocked { filter: brightness(.72); }
.cv { font-weight: 900; line-height: 1; }
.cv.vert { writing-mode: vertical-rl; text-orientation: upright; letter-spacing: -1px; }
.cd { position: absolute; right: 3px; bottom: 1px; font: 700 9px "Press Start 2P", system-ui; color: #c0282a; }
.sol-bottom { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
.sol-bottom .card { position: relative; }
.stock { cursor: pointer; font-size: 18px; }
.stock.empty { opacity: .3; cursor: default; }
.sol-end { margin-top: 20vh; padding: 20px; text-align: center; }

/* título */
#title { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 16px calc(60px + var(--sab)); gap: 10px; pointer-events: none; }
#title > * { pointer-events: auto; }
.tbtn { width: min(320px, 90vw); font-size: 17px; padding: 14px; }
.tsmall { color: var(--dim); font-size: 12px; text-align: center; }
.tsmall a { color: var(--dim); }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <button id="menubtn" aria-label="Menu">☰</button>
  <div id="touch">
    <div id="dpad"><i class="u">▲</i><i class="d">▼</i><i class="l">◀</i><i class="r">▶</i></div>
    <button id="abtn">A</button>
  </div>
  <div id="battle-ui"></div>
  <div id="dialog"></div>
  <div id="panel"></div>
  <div id="title">
    <button class="btn tbtn" id="t-cont" style="display:none">▶ Continuar</button>
    <button class="btn tbtn" id="t-new">✨ Novo jogo</button>
    <div class="tsmall">Criaturas feitas dos kanji que você aprendeu · <a href="../">📚 voltar ao app de estudo</a></div>
  </div>
  <div id="toast"></div>
</div>
<script src="../hanzi-writer.min.js"></script>
<script src="../kanji-strokes.js"></script>
<script src="../kanji-list.js"></script>
<script src="../kanji-words.js"></script>
